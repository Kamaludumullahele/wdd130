<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
    <header></header>
    <main>
        <form>
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">Email</label>
            <input type="email" id="useremail" name="useremail" required>
            <label for="select">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            <label for="browser">What is your favorite internet browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="firebox">Firebox</option>
                <option value="safari">Safari</option>
            </select>
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">List the places where you have lived</label>
            <textarea name="feedback" id="feedback" rows="4" placeholder="still water florida, Amsterdam Netherland, Timbukti Malli"></textarea>
            <button type="submit">Submit poll</button>

        </form>
    </main>
    <footer></footer>
    
</body>
</html>
