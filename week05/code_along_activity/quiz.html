<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>✅ Basic HTML and CSS Quiz</h1>
        <form action="">
            <div class="quiz-item">
                <label for="q1">1.What does stand for CSS?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item">
                <label for="q2">2.What does stand for html?</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div class="quiz-item">
                <label for="q3">3.Choose the right comment</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one...</option>
                    <option value="a">A &lt; This is a comment &gt;</option>
                    <option value="b">B */ This is a comment */</option>
                    <option value="c">C // This is a comment</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4. What is the bottem margin px in declaration?</label>
                <div class="code-box">margin: 10px 5px 15px;</div>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">Submit the quiz</button>
        </form>
    </main>
</body>
</html>
